<style>


*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}


body{
  background:#e8ecdf;
  padding:20px;
}


main{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}


header{
  grid-column:1/3;
  display:flex;
  justify-content:space-between;
  align-items:center;
}


section{
  display:grid;
  gap:20px;
}


article{
  border-radius:25px;
  padding:20px;
}


nav{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}


aside{
  background:#003d12;
  color:white;
  border-radius:25px;
  padding:20px;
}


button{
  border:none;
  border-radius:20px;
  padding:8px 18px;
  font-weight:bold;
}


table{
  width:100%;
}


@media(max-width:900px){


  main{
    grid-template-columns:1fr;
  }


  header{
    flex-direction:column;
    gap:20px;
  }


  nav{
    grid-template-columns:1fr;
  }


}


</style>
</head>
